name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build & test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # The repository root IS the package (no monorepo wrapper), so all
      # steps run at $GITHUB_WORKSPACE — no working-directory override needed.
      # setup-node v5+ no longer auto-resolves a cache path, so we leave it off.
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: smoke (cli)
        run: |
          mkdir -p .tmp
          node dist/cli/index.js --store .tmp/ci.db ingest examples/session-a.jsonl
          node dist/cli/index.js --store .tmp/ci.db ingest examples/session-b.jsonl
          node dist/cli/index.js --store .tmp/ci.db ls
          node dist/cli/index.js --store .tmp/ci.db diff sess-A sess-B
          node dist/cli/index.js --store .tmp/ci.db compare sess-A sess-B -o .tmp/compare.html
          test -s .tmp/compare.html